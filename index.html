<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcX</title>
    <style>
        body {
            background: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .calculator {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 300px;
        }
        #display {
            width: 100%;
            height: 70px;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            background: #252525;
            color: #fff;
            border: none;
            border-radius: 16px;
            margin-bottom: 15px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 58px;
            font-size: 24px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: #2d2d2d;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .operator {
            background: #ff9500;
            color: white;
        }
        .clear {
            background: #e63939;
        }
        .equal {
            background: #00c853;
            grid-column: span 1;
        }
        .zero {
            grid-column: span 2;
            border-radius: 30px;
        }
    </style>
</head>
<body>
<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="press('(')">(</button>
        <button onclick="press(')')">)</button>
        <button class="operator" onclick="press('÷')">÷</button>

        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button class="operator" onclick="press('×')">×</button>

        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button class="operator" onclick="press('-')">-</button>

        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button class="operator" onclick="press('+')">+</button>

        <button onclick="press('0')" class="zero">0</button>
        <button onclick="press('.')">.</button>
        <button onclick="backspace()">⌫</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");

    function press(val) {
        display.value += val;
    }

    function clearDisplay() {
        display.value = "";
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function unlockSite(url) {
        try {
            const win = window.open("about:blank", "_blank");
            if (win) {
                setTimeout(() => {
                    win.document.write(`
                        <!DOCTYPE html>
                        <html style="height:100%;margin:0;background:#000;">
                        <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
                        <body style="margin:0;height:100%;background:#000;overflow:hidden;">
                            <iframe src="${url}" 
                                    style="width:100%;height:100vh;border:none;" 
                                    frameborder="0" allowfullscreen
                                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
                        </body></html>
                    `);
                    win.document.close();
                }, 50);
            }
        } catch (e) { console.error(e); }
        display.value = "";
    }

    function calculate() {
        const pass = display.value.trim();

        // === SECRET PASSWORDS ===
        if (pass === "5659") return unlockSite("https://theundergroumdnetwork.github.io/TheundergroundNetworks-Web-Page/");
        if (pass === "1223") return unlockSite("https://theundergroumdnetwork.github.io/we-remade-the-real-classrom-game-/");
        if (pass === "1578") return unlockSite("https://theundergroumdnetwork.github.io/Duck-tiny-exams-unbocled-/");

        // Normal calculation
        let expr = pass.replace(/×/g, '*').replace(/÷/g, '/');
        try {
            display.value = eval(expr);
        } catch {
            display.value = "Error";
            setTimeout(() => display.value = "", 800);
        }
    }
</script>
</body>
</html>
